# Nodes with values to reuse in the pipeline.
common_params:
  plugins: &common_plugins
  - automattic/a8c-ci-toolkit#2.17.0
  env: &common_env
    IMAGE_ID: xcode-15.2

agents:
  queue: mac # Run on the macOS runner by default

# This is the default pipeline – it will build and test the package
steps:
  ########################
  # Validate Swift Package
  ########################
  - label: "🔬 Validate Swift Package"
    key: "test"
    command: "validate_swift_package"
    env: *common_env
    plugins: *common_plugins
